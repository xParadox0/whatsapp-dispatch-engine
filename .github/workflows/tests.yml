name: tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Run the test suite
        run: python3 -m unittest discover -s tests -v

      - name: Run the end-to-end demo
        run: python3 examples/demo_dispatch.py
